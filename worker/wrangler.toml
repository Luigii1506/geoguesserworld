name = "geoguesser-images"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Better Auth usa APIs de Node (crypto, AsyncLocalStorage)
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# sin URLs de vista previa por versión: solo la de producción
preview_urls = false

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "geoguesser"

# base de geografía (geo/schema.sql); `npm run pipeline -- geo publish` la crea y rellena
# y escribe aquí su database_id
[[d1_databases]]
binding = "GEO"
database_name = "geomastery-geo"
database_id = "c78376e8-a415-4181-8951-22da81498769"

# la app (npm run build → dist/). Las rutas de datos pasan antes por el Worker, que comprueba
# la sesión; el resto se sirve tal cual sin ejecutarlo (no gasta peticiones del Worker)
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*", "/thumb/*", "/sm/*", "/atlas/*", "/community/*"]

[vars]
BETTER_AUTH_URL = "https://geoguesser-images.luis-e.workers.dev"
